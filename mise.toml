[env]
_.path = ["bin"]

[tools]
neovim = "latest"
stylua = "latest"
lua-language-server = "latest"
typos = "latest"
taplo = "latest"

[task_config]
includes = ["tasks"]

[tasks.deps]
description = ":install: test dependencies"
run = "test -d deps/mini.nvim || git clone --quiet --depth 1 https://github.com/nvim-mini/mini.nvim deps/mini.nvim"

[tasks.test]
description = ":test: mini.test"
depends = ["deps"]
run = "nvim --headless --noplugin -u tests/minimal_init.lua -c 'lua MiniTest.run()'"

[tasks."test:watch"]
description = ":watchexec: tests"
run = "mise watch test --glob 'lua/**/*.lua' --glob 'plugin/**/*.lua' --glob 'tests/**/*.lua'"

[tasks.format]
description = ":format: lua"
run = "stylua ."

[tasks.lint]
description = ":lint: all"
depends = ["lint:*"]

[tasks."lint:style"]
description = ":lint: lua style"
run = "stylua --check ."

[tasks."lint:types"]
description = ":lint: lua types"
depends = ["deps"]
run = """
VIMRUNTIME="$(nvim --clean --headless -c 'lua io.write(vim.env.VIMRUNTIME)' -c 'qa')" \
  lua-language-server --check . --checklevel=Warning
"""

[tasks."lint:typos"]
description = ":lint: spelling"
run = "typos"

[tasks."lint:toml"]
description = ":lint: toml"
run = "taplo fmt --check"

[tasks.pre-push]
description = ":check: before push"
depends = ["lint", "test"]
